<div class="phone"><header><span class="brand">Cuillère</span><button class="primary" id="kp-preview">Preview</button></header><main>
<div class="cover" id="kp-cover"><button id="kp-cover-add"><i data-lucide="camera" aria-hidden="true"></i>Add a cover</button></div><input type="file" id="kp-cover-file" accept="image/*" hidden aria-label="Cover photo">
<input class="title" id="kp-title" aria-label="Page title" value="A rainy day, cinnamon rolls"><small>My kitchen, my little experiments.</small>
<div id="kp-blocks"></div><div id="kp-add"><button class="full" id="kp-picker"><i data-lucide="plus" aria-hidden="true"></i>Add to my page</button><div class="add-menu" id="kp-menu" hidden><button data-new="ingredients"><i data-lucide="wheat" aria-hidden="true"></i>Ingredients</button><button data-new="process"><i data-lucide="list-ordered" aria-hidden="true"></i>Process</button><button data-new="text"><i data-lucide="notebook-pen" aria-hidden="true"></i>Words</button><button data-new="sketch"><i data-lucide="pencil" aria-hidden="true"></i>Sketch</button><button data-new="photo"><i data-lucide="image" aria-hidden="true"></i>Photo</button></div></div><p id="kp-status" aria-live="polite"><small>Session concept · Your page can be as simple as you like.</small></p>
</main><nav><button data-nav="recipes"><i data-lucide="book-open" aria-hidden="true"></i>Recipes</button><button data-nav="add"><i data-lucide="plus" aria-hidden="true"></i>Add</button><button data-nav="templates"><i data-lucide="layout-template" aria-hidden="true"></i>Templates</button></nav></div>
<script>
(function(){
const root=document.getElementById('kitchen-pages'),container=root.querySelector('#kp-blocks'),status=root.querySelector('#kp-status');let next=3,reading=false,cover='',undo=null;
const blocks=[{id:1,type:'ingredients',title:'Ingredients',items:[]},{id:2,type:'text',title:'A little thought',text:'What if I tried orange zest next time?\n\nToday the kitchen feels like the warmest place in the house.'}];
const names={ingredients:'Ingredients',process:'Process',text:'My words',sketch:'A little sketch',photo:'A moment'};
const pantry=[['Flour','wheat','g'],['Milk','milk','ml'],['Water','droplets','ml'],['Yeast','sprout','g'],['Butter','sandwich','g'],['Egg','egg','piece']];
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function icons(){if(typeof lucide!=='undefined')lucide.createIcons();}
function toolbar(b,i){return '<div class="row">'+(reading?'<h3>'+esc(b.title)+'</h3>':'<input style="flex:1;width:100px" data-title="'+b.id+'" aria-label="Block title" value="'+esc(b.title)+'"><div class="tools"><button data-up="'+i+'" '+(i===0?'disabled':'')+' aria-label="Move block up">↑</button><button data-down="'+i+'" '+(i===blocks.length-1?'disabled':'')+' aria-label="Move block down">↓</button><button data-remove="'+i+'" aria-label="Remove block">×</button></div>')+'</div>';}
function render(){root.querySelector('#kp-preview').textContent=reading?'Edit':'Preview';root.querySelector('#kp-add').hidden=reading;root.querySelector('#kp-title').readOnly=reading;root.querySelector('#kp-cover').innerHTML=cover?'<img src="'+cover+'" alt="Recipe cover">'+(!reading?'<button id="kp-cover-add" aria-label="Change cover"><i data-lucide="camera" aria-hidden="true"></i></button>':''):(!reading?'<button id="kp-cover-add"><i data-lucide="camera" aria-hidden="true"></i>Add a cover</button>':'');
container.innerHTML=blocks.map((b,i)=>{let body='';if(b.type==='ingredients'){body=(!reading?'<div class="shelf">'+pantry.map((p,j)=>'<button data-food="'+b.id+','+j+'"><i data-lucide="'+p[1]+'" aria-hidden="true"></i>'+p[0]+'</button>').join('')+'</div>':'')+b.items.map((x,j)=>reading?'<p>'+esc(x.name)+' '+esc(x.qty)+' '+esc(x.unit)+'</p>':'<div class="ingredient"><input data-item="'+b.id+','+j+',name" aria-label="Ingredient" value="'+esc(x.name)+'"><input data-item="'+b.id+','+j+',qty" aria-label="Amount" placeholder="Qty" value="'+esc(x.qty)+'"><input data-item="'+b.id+','+j+',unit" aria-label="Unit" value="'+esc(x.unit)+'"><button data-delete-item="'+b.id+','+j+'" aria-label="Remove ingredient">×</button></div>').join('')+(!b.items.length?'<small>Add only the ingredients you want to explore.</small>':'')+(!reading?'<button data-custom="'+b.id+'">＋ Custom ingredient</button>':'');}
if(b.type==='text'||b.type==='process')body=reading?'<p class="read">'+esc(b.text)+'</p>':'<label>'+ (b.type==='process'?'Your process':'')+'<textarea aria-label="Page text" data-text="'+b.id+'" rows="4">'+esc(b.text)+'</textarea></label>';
if(b.type==='photo')body=(b.image?'<img src="'+b.image+'" alt="'+esc(b.title)+'">':'<small>A photo from your kitchen, or a little inspiration.</small>')+(!reading?'<label>Choose photo<input type="file" accept="image/*" data-photo="'+b.id+'"></label>':'');
if(b.type==='sketch')body=reading?'<canvas data-canvas="'+b.id+'" aria-label="'+esc(b.title)+'"></canvas>':'<div class="penbar"><input type="color" aria-label="Pen colour" data-color="'+b.id+'" value="'+b.color+'"><select aria-label="Drawing tool" data-tool="'+b.id+'"><option value="pen"'+(b.tool==='pen'?' selected':'')+'>Pen</option><option value="eraser"'+(b.tool==='eraser'?' selected':'')+'>Eraser</option></select><button data-undo-stroke="'+b.id+'" aria-label="Undo last stroke">↶ Undo</button></div><canvas data-canvas="'+b.id+'" aria-label="Draw your idea"></canvas><label>Sketch description<input data-description="'+b.id+'" placeholder="Describe your idea in words too" value="'+esc(b.description)+'"></label>';

.temp)+'" placeholder="Temp"><select data-step-edit="'+b.id+','+s.id+',tempUnit" aria-label="Temperature unit"><option'+(s.tempUnit==='°C'?' selected':'')+'>°C</option><option'+(s.tempUnit==='°F'?' selected':'')+'>°F</option></select><button data-step-hide-temp="'+b.id+','+s.id+'" aria-label="Remove step temperature">×</button></div>':'')+'<div class="step-actions"><button data-step-photo="'+b.id+','+s.id+'" aria-label="Add step photo"><i data-lucide="camera" aria-hidden="true"></i></button><button data-step-time="'+b.id+','+s.id+'" aria-label="Add step time"><i data-lucide="clock-3" aria-hidden="true"></i>'+(s.time?esc(s.time)+' '+s.timeUnit:'')+'</button><button data-step-temp="'+b.id+','+s.id+'" aria-label="Add step temperature"><i data-lucide="thermometer" aria-hidden="true"></i>'+(s.temp?esc(s.temp)+' '+s.tempUnit:'')+'</button></div>')+'</article>').join('')+'</div>'+(!reading?'<button class="add-step" data-step-add="'+b.id+'" aria-label="Add step"><i data-lucide="plus" aria-hidden="true"></i></button>':'');}
render=function(){blocks.filter(b=>b.type==='process').forEach(b=>{if(!b.steps){b.steps=[newStep()];b.steps[0].text=b.text||'';}});processBaseRender();container.querySelectorAll('.block.process').forEach(el=>{const b=blocks.find(x=>x.id===Number(el.dataset.blockId));const head=el.querySelector('.block-head');Array.from(el.children).forEach(child=>{if(child!==head)child.remove();});el.insertAdjacentHTML('beforeend',processBody(b));});icons();};
function resolveStep(value){const [id,sid]=value.split(',').map(Number);const block=blocks.find(b=>b.id===id);return {block,step:block?.steps.find(s=>s.id===sid)};}
root.addEventListener('input',e=>{const key=e.target.dataset.stepEdit;if(!key||e.target.tagName==='SELECT')return;const {step}=resolveStep(key);if(step)step[key.split(',')[2]]=e.target.value;});
root.addEventListener('change',e=>{const key=e.target.dataset.stepEdit;if(!key)return;const {step}=resolveStep(key);if(!step)return;const field=key.split(',')[2],value=e.target.value;if(field==='tempUnit'&&step.temp!==''&&step.tempUnit!==value){const n=Number(step.temp);step.temp=String(Number((value==='°F'?n*9/5+32:(n-32)*5/9).toFixed(2)));}if(field==='timeUnit'&&step.time!==''&&step.timeUnit!==value){const n=Number(step.time);step.time=String(Number((value==='h'?n/60:n*60).toFixed(4)));}step[field]=value;if(e.target.tagName==='SELECT')render();});
root.addEventListener('click',e=>{if(skipStepClick){skipStepClick=false;e.stopImmediatePropagation();return;}const button=e.target.closest('button');if(!button)return;const d=button.dataset;const entry=Object.keys(d).find(k=>k.startsWith('step'));if(!entry&&button.id!=='kp-step-undo')return;e.stopImmediatePropagation();if(button.id==='kp-step-undo'&&stepUndo){const b=blocks.find(b=>b.id===stepUndo.id);if(b)b.steps=JSON.parse(stepUndo.steps);stepUndo=null;render();return;}if(d.stepAdd){blocks.find(b=>b.id===Number(d.stepAdd)).steps.push(newStep());render();return;}const {block,step}=resolveStep(d[entry]);if(!step)return;
if(d.stepOptions){const card=button.closest('.step-card'),old=card.querySelector('.step-options');if(old){old.remove();return;}const i=block.steps.indexOf(step);card.insertAdjacentHTML('beforeend','<div class="step-options"><button data-step-duplicate="'+block.id+','+step.id+'">Duplicate</button><button data-step-remove="'+block.id+','+step.id+'">Remove</button><label style="width:100%">Position<select style="margin-left:8px;min-height:40px" aria-label="Step position" data-step-position="'+block.id+','+step.id+'">'+block.steps.map((s,j)=>'<option value="'+j+'"'+(j===i?' selected':'')+'>Step '+(j+1)+'</option>').join('')+'</select></label></div>');return;}
if(d.stepTime)step.showTime=!step.showTime;
if(d.stepTemp)step.showTemp=!step.showTemp;
if(d.stepHideTime){step.showTime=false;step.time='';}
if(d.stepHideTemp){step.showTemp=false;step.temp='';}

if(d.stepPhoto){const file=document.createElement('input');file.type='file';file.accept='image/*';file.onchange=()=>{const f=file.files[0];if(!f)return;if(!f.type.startsWith('image/')||f.size>10*1024*1024){status.textContent='Choose an image under 10 MB.';return;}const reader=new FileReader();reader.onload=()=>{const current=resolveStep(d.stepPhoto).step;if(current){current.photo=String(reader.result);render();}};reader.onerror=()=>status.textContent='Could not read this photo.';reader.readAsDataURL(f);};file.click();return;}render();},true);

root.addEventListener('pointerdown',e=>{const head=e.target.closest('[data-step-handle]');if(reading||!head||e.target.closest('button')||e.button!==0)return;const drag={head,value:head.dataset.stepHandle,x:e.clientX,y:e.clientY,ready:false};stepDrag=drag;drag.timer=setTimeout(()=>{if(stepDrag!==drag)return;drag.ready=true;head.setPointerCapture(e.pointerId);head.closest('.step-card').classList.add('step-lifted');},260);});
root.addEventListener('pointermove',e=>{const d=stepDrag;if(!d)return;if(!d.ready){if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>12){clearTimeout(d.timer);stepDrag=null;}return;}const card=d.head.closest('.step-card'),target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.step-card');if(!target||target===card||target.dataset.processId!==card.dataset.processId)return;const list=card.parentElement,before=new Map(Array.from(list.children).map(x=>[x.dataset.stepId,x.getBoundingClientRect().top])),r=target.getBoundingClientRect();list.insertBefore(card,e.clientY<r.top+r.height/2?target:target.nextSibling);if(!matchMedia('(prefers-reduced-motion: reduce)').matches)Array.from(list.children).forEach(el=>{const delta=before.get(el.dataset.stepId)-el.getBoundingClientRect().top;if(delta)el.animate([{transform:'translateY('+delta+'px)'},{transform:'translateY(0)'}],{duration:180,easing:'ease-out'});});});
function endStep(cancel){if(!stepDrag)return;const d=stepDrag;stepDrag=null;clearTimeout(d.timer);if(!d.ready)return;if(!cancel){const {block}=resolveStep(d.value),list=d.head.closest('.process-steps');const order=Array.from(list.children).map(el=>Number(el.dataset.stepId));block.steps=order.map(id=>block.steps.find(s=>s.id===id));}skipStepClick=true;setTimeout(()=>skipStepClick=false,0);render();}
